# One-shot / ops helper: deploy KiryuCode/chllc using this repo's SSH_PRIVATE_KEY
# (chllc's own Actions secret is not set yet). Safe to leave; workflow_dispatch only.
#
# Run: Actions → Deploy chllc → Run workflow

name: Deploy chllc

on:
  workflow_dispatch:

env:
  HOST: 74.208.35.191
  REMOTE_USER: root
  REMOTE_DIR: /var/www/chllc

jobs:
  deploy-chllc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chllc
        uses: actions/checkout@v4
        with:
          repository: KiryuCode/chllc
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -z "${SSH_PRIVATE_KEY//[$' \t\r\n']/}" ]; then
            echo "ERROR: secrets.SSH_PRIVATE_KEY empty in canopy-goods"
            exit 1
          fi
          decoded=0
          if printf '%s' "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/deploy_key 2>/dev/null \
            && grep -qE 'BEGIN .*PRIVATE KEY' ~/.ssh/deploy_key; then
            decoded=1
          fi
          if [ "$decoded" -eq 0 ]; then
            printf '%s' "$SSH_PRIVATE_KEY" | sed 's/\r$//' > ~/.ssh/deploy_key
            if ! grep -qE 'BEGIN .*PRIVATE KEY' ~/.ssh/deploy_key; then
              printf '%s' "$SSH_PRIVATE_KEY" | sed 's/\r//g; s/\\n/\n/g' > ~/.ssh/deploy_key
            fi
          fi
          if [ -s ~/.ssh/deploy_key ] && [ "$(tail -c1 ~/.ssh/deploy_key | wc -c)" -ne 0 ]; then
            if [ "$(tail -c1 ~/.ssh/deploy_key | wc -l)" -eq 0 ]; then
              echo >> ~/.ssh/deploy_key
            fi
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH key OK"

      - name: Deploy chllc
        env:
          SSH_KEY: /home/runner/.ssh/deploy_key
        run: bash scripts/deploy.sh

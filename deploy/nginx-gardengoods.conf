# Install on zen88 as /etc/nginx/sites-available/gardengoods.adavis.shop
# then: ln -s ../sites-available/gardengoods.adavis.shop /etc/nginx/sites-enabled/
# Certbot: certbot --nginx -d gardengoods.adavis.shop -d gg.adavis.shop
#
# Proxies both hostnames to Garden Goods on 127.0.0.1:4842

server {
    listen 80;
    listen [::]:80;
    server_name gardengoods.adavis.shop gg.adavis.shop;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gardengoods.adavis.shop gg.adavis.shop;
    client_max_body_size 15M;

    # ssl_certificate / ssl_certificate_key filled by Certbot

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:4842;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
